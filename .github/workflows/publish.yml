name: Publish to npm
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11.5+, required for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance
        env:
          # Only needed until trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
